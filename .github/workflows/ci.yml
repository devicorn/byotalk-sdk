name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token unless a job asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      # Protocol conformance against the latest server image (see byotalk-server/docs/08 §12).
      - name: Start byotalk-server
        run: |
          docker run -d --name byotalk --network host \
            -e NODE_ENV=development -e DATABASE_ADMIN_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e DATABASE_URL=postgres://app_rw:app_rw@localhost:5432/postgres \
            -e DATABASE_PIPELINE_URL=postgres://app_pipeline:app_pipeline@localhost:5432/postgres \
            -e REDIS_URL=redis://localhost:6379 -e BYOTALK_MASTER_KEY=${{ secrets.TEST_MASTER_KEY }} \
            -e EGRESS_ALLOW_PRIVATE=true -e RATE_LIMIT_SCALE=20 -e MIGRATE_ON_START=true \
            -e MEDIA_PUBLIC_URL=ws://localhost:3003 -e MEDIA_ANNOUNCED_IP=127.0.0.1 -e MEDIA_WORKERS=1 \
            -e TURN_URLS="turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp" -e TURN_SECRET=ci-turn-secret \
            ghcr.io/${{ github.repository_owner }}/byotalk-server:latest node dist/roles/all.js
          docker run -d --name coturn --network host coturn/coturn:4.6 -n --listening-ip=127.0.0.1 --listening-port=3478 \
            --relay-ip=127.0.0.1 --min-port=49160 --max-port=49260 --realm=ci --use-auth-secret \
            --static-auth-secret=ci-turn-secret --allow-loopback-peers --no-cli --no-tls --no-dtls --fingerprint
          for i in $(seq 1 30); do curl -sf localhost:3000/readyz && curl -sf localhost:3003/healthz && break; sleep 2; done
      - run: pnpm test:integration
      # Real WebRTC calls in Chromium (fake camera/microphone) through the media node and coturn.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
