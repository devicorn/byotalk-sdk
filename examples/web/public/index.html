<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ByoTalk example chat</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- byotalk/calls imports mediasoup-client; a bundler resolves it in real apps, here the server bundles it. -->
    <script type="importmap">{ "imports": { "mediasoup-client": "/sdk/mediasoup-client.js" } }</script>
  </head>
  <body>
    <main id="login" class="login">
      <form id="login-form" class="card">
        <h1>ByoTalk example chat</h1>
        <p class="muted">Sign in as any user. Open a second browser window as another user to chat.</p>
        <label>User id <input name="userId" required pattern="[A-Za-z0-9_\-@.:]{1,128}" placeholder="alice" autocomplete="off" /></label>
        <label>Display name <input name="name" placeholder="Alice" autocomplete="off" /></label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>

    <div id="app" class="app" hidden>
      <aside class="sidebar">
        <header class="me">
          <div>
            <strong id="me-name"></strong>
            <span id="conn" class="badge">connecting</span>
          </div>
          <button id="logout" class="link">Sign out</button>
        </header>
        <form id="new-dm" class="new-chat">
          <input name="userId" placeholder="Chat with user id…" required aria-label="User id to chat with" autocomplete="off" />
          <button type="submit">Chat</button>
        </form>
        <form id="new-group" class="new-chat">
          <input name="name" placeholder="Group name" required aria-label="Group name" autocomplete="off" />
          <input name="members" placeholder="user ids, comma separated" required aria-label="Group members" autocomplete="off" />
          <button type="submit">New group</button>
        </form>
        <ul id="conversations" class="conversations" aria-label="Conversations"></ul>
      </aside>

      <section class="thread" aria-live="polite">
        <div id="empty" class="empty">Pick a conversation or start a new chat.</div>
        <div id="chat" class="chat" hidden>
          <header class="thread-head">
            <div>
              <strong id="title"></strong>
              <span id="presence" class="muted"></span>
            </div>
            <div class="call-buttons">
              <button id="join-call" hidden>Join call</button>
              <button id="call-audio" title="Voice call" aria-label="Voice call">📞</button>
              <button id="call-video" title="Video call" aria-label="Video call">🎥</button>
            </div>
          </header>
          <button id="older" class="link older">Load older messages</button>
          <ol id="messages" class="messages"></ol>
          <div id="typing" class="typing muted"></div>
          <form id="composer" class="composer">
            <label class="attach" title="Attach a file">📎<input id="file" type="file" hidden /></label>
            <input id="text" placeholder="Message" autocomplete="off" aria-label="Message" />
            <button type="submit">Send</button>
          </form>
          <div id="upload" class="muted upload" hidden></div>
          <p id="chat-error" class="error" role="alert"></p>
        </div>
      </section>
    </div>
    <div id="incoming" class="incoming" role="alertdialog" aria-labelledby="incoming-text" hidden>
      <p id="incoming-text"></p>
      <div class="row">
        <button id="accept-video">🎥 Accept</button>
        <button id="accept-audio">📞 Accept audio</button>
        <button id="decline" class="danger">Decline</button>
      </div>
    </div>

    <section id="call" class="call" aria-label="Call" hidden>
      <header class="call-head">
        <strong id="call-status"></strong>
        <span id="call-quality" class="muted"></span>
      </header>
      <div id="tiles" class="tiles"></div>
      <div id="call-sound" hidden></div>
      <p id="call-error" class="error" role="alert"></p>
      <footer class="controls">
        <button id="mic"></button>
        <button id="cam"></button>
        <button id="flip">🔄 Switch camera</button>
        <button id="share"></button>
        <button id="hangup" class="danger">Hang up</button>
      </footer>
    </section>
    <script type="module" src="/app.js"></script>
  </body>
</html>
